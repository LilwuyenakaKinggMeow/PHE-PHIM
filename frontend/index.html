<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">

    <link rel="icon" type="image/png" href="assets/LOGO.png">

    <title>PHÊ PHIM | Cinema</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="toast-container" id="toastContainer"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-inner">

            <a href="index.html" class="brand">
                <img src="assets/LOGO.png" alt="Phê Phim" class="brand-icon">

                <div class="brand-text">
                    <span class="brand-title">PHÊ PHIM</span>
                    <span class="brand-sub">Cinema</span>
                </div>
            </a>

            <div class="header-controls">

                <!-- SEARCH -->
                <div class="control-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>

                    <input type="text" id="searchInput" class="search-input" placeholder="Tìm phim, thể loại...">
                </div>

                <!-- CINEMA -->
                <div class="control-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>

                    <select id="cinemaSelect" class="custom-select">
                        <option value="">Đang tải danh sách rạp...</option>
                    </select>
                </div>

                <!-- TRA CỨU VÉ -->
                <button type="button" class="lookup-ticket-btn" id="openTicketLookup">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 4h16v16H4z" />
                        <path d="M8 8h8M8 12h8M8 16h4" />
                    </svg>
                    <span>Tra cứu vé</span>
                </button>

            </div>
        </div>
    </header>


    <!-- MAIN -->
    <main class="container">

        <section class="hero-section" id="heroSection">

            <div class="section-header">
                <h2 class="section-title">
                    <span class="dot"></span>
                    Khám Phá Phim
                </h2>
            </div>

            <!-- JAVASCRIPT RENDER MOVIES -->
            <div class="movie-cards-row" id="movieCardsRow"></div>

        </section>

    </main>

    <!-- TRA CỨU VÉ MODAL -->
    <div class="modal-backdrop" id="ticketLookupModal">
        <div class="modal-card ticket-lookup-card">

            <div class="modal-header">
                <h3>Tra Cứu Vé</h3>

                <button type="button" class="close-modal-btn" id="closeTicketLookup" aria-label="Đóng">
                    ✕
                </button>
            </div>

            <div class="ticket-lookup-body">

                <p class="ticket-lookup-description">
                    Nhập mã đặt vé để xem thông tin vé điện tử của bạn.
                </p>

                <label for="ticketBookingCode">Mã đặt vé</label>

                <div class="ticket-lookup-input-group">
                    <input type="text" id="ticketBookingCode" placeholder="Ví dụ: PPH-1795055031084-A04D1D80"
                        autocomplete="off">

                    <button type="button" id="searchTicketBtn">
                        Tra cứu
                    </button>
                </div>

                <div id="ticketLookupMessage" class="ticket-lookup-message"></div>

                <div id="ticketLookupResult" class="ticket-lookup-result"></div>

            </div>

        </div>
    </div>
    <!-- FOOTER -->
    <footer class="site-footer">

        <div class="container footer-content">

            <div class="footer-left">

                <div class="footer-brand">PHÊ PHIM</div>

                <p class="footer-description">
                    Trải nghiệm điện ảnh đỉnh cao – Nơi cảm xúc thăng hoa qua từng khung hình.
                </p>

            </div>

            <div class="footer-right">

                <p>© 2026 PHÊ PHIM. All rights reserved.</p>

                <span>
                    Designed for movie lovers · Premium Cinema Experience
                </span>

            </div>

        </div>

    </footer>


    <script src="script.js" defer></script>
    <script src="seats.js" defer></script>
    <script src="booking.js" defer></script>

</body>

</html>
