
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-phephim-vandung
    restart: unless-stopped
    environment:
      POSTGRES_USER: phephim
      POSTGRES_PASSWORD: phephim_dev_2026
      POSTGRES_DB: phephim
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_phephim_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phephim -d phephim"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-phephim-vandung
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_phephim_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_phephim_data:
  redis_phephim_data:
